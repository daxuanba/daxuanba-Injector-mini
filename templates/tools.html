<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱 - 大轩巴入库器mini</title>
    <link rel="icon" href="{{ url_for('static', filename='dxb-word.svg') }}" type="image/svg+xml"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/manager.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dx-theme.css') }}">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('dxb-theme-preference') || 'dark';
                document.documentElement.classList.add(t === 'dark' ? 'dxb-dark' : 'dxb-light');
            } catch (e) {
                document.documentElement.classList.add('dxb-dark');
            }
        })();
    </script>
    <style>
        .tool-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;
            background:var(--md-sys-color-surface-container-high);margin-bottom:10px;}
        .status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
        .dot-ok{background:var(--md-sys-color-success);}
        .dot-warn{background:var(--md-sys-color-warning);}
        .dot-error{background:var(--md-sys-color-error);}
        .dot-info{background:var(--md-sys-color-secondary);}
        .tool-name{font-weight:600;min-width:160px;flex:0 0 auto;color:var(--md-sys-color-on-surface);}
        .tool-detail{flex:1;min-width:0;font-size:13px;line-height:1.5;
            color:var(--md-sys-color-on-surface-variant);word-break:break-all;}
        .fix-bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px;}
        .summary-chip{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;
            background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);}
        .summary-chip.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
        .summary-chip.warn{background:var(--md-sys-color-warning-container);color:var(--md-sys-color-on-warning-container);}
        .dl-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;
            background:var(--md-sys-color-surface-container-high);margin-bottom:10px;}
        .dl-main{flex:1;min-width:0;}
        .dl-name{font-weight:600;color:var(--md-sys-color-on-surface);}
        .dl-meta{font-size:12px;margin-top:3px;color:var(--md-sys-color-on-surface-variant);}
        .dl-progress{height:8px;border-radius:999px;background:var(--md-sys-color-surface-variant);
            overflow:hidden;margin-top:7px;}
        .dl-progress > i{display:block;height:100%;background:var(--dx-yellow);transition:width .3s;}
        .dl-actions{display:flex;gap:8px;flex:0 0 auto;align-items:center;}
        .dl-list.done .dl-item{padding:9px 14px;opacity:.88;}
        .empty-hint{color:var(--md-sys-color-on-surface-variant);font-size:14px;padding:10px 2px;}
        .sec-title{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
            color:var(--md-sys-color-on-surface-variant);margin:16px 0 8px;}
        .sec-title:first-child{margin-top:0;}
    </style>
</head>
<body>
<div id="background-overlay"></div>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="dxb-wordmark">大轩巴</span>
            <div class="sidebar-version">入库器mini</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="/">
                <span class="material-icons">home</span><span>首页</span>
            </a>
            <a class="nav-item" href="/manager">
                <span class="material-icons">library_books</span><span>入库管理</span>
            </a>
            <a class="nav-item" href="/craft"><span class="material-icons">auto_fix_high</span><span>手搓</span></a>
            <a class="nav-item" href="/free">
                <span class="material-icons">card_giftcard</span><span>免费游戏</span>
            </a>
            <a class="nav-item" href="/recommend">
                <span class="material-icons">local_fire_department</span><span>推荐</span>
            </a>
            <a class="nav-item active" href="/tools">
                <span class="material-icons">build</span><span>工具箱</span>
            </a>
            <a class="nav-item" href="/settings">
                <span class="material-icons">settings</span><span>设置</span>
            </a>
            <a class="nav-item" href="/about">
                <span class="material-icons">info</span><span>关于</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-action" id="themeToggleBtn" title="切换主题"><span class="material-icons">dark_mode</span></button>
            <button class="nav-action" id="backgroundSettingsBtn" title="自定义背景"><span class="material-icons">wallpaper</span></button>
            <button class="nav-action" id="shutdownBtn" title="关闭应用"><span class="material-icons">power_settings_new</span></button>
        </div>
    </aside>
    <div class="content-area">
        <header class="content-header">
            <span class="dxb-wordmark">大轩巴</span>
            <h1 class="app-title">工具箱</h1>
        </header>
        <main class="manager-main-content">

            <div class="card manager-card">
                <div class="card-header">
                    <h2>Steam 错误诊断与修复</h2>
                    <div class="card-actions">
                        <button class="btn btn-secondary" id="diagBtn"><span class="material-icons">health_and_safety</span> 开始体检</button>
                        <button class="btn btn-primary" id="fixAllBtn"><span class="material-icons">handyman</span> 一键修复</button>
                    </div>
                </div>
                <div id="diagSummary" style="margin-bottom:12px;"></div>
                <div class="fix-bar" id="diagFixBar"></div>
                <div id="diagList">
                    <div class="empty-hint">点「开始体检」检查 Steam 路径、权限、磁盘、hosts、缓存与网络。</div>
                </div>
            </div>

            <div class="card manager-card">
                <div class="card-header">
                    <h2>下载管理</h2>
                    <div class="card-actions">
                        <button class="btn btn-secondary" id="dlRefreshBtn"><span class="material-icons">refresh</span> 刷新</button>
                        <button class="btn btn-secondary" id="dlOpenSteamBtn"><span class="material-icons">open_in_new</span> 打开 Steam 下载页</button>
                    </div>
                </div>
                <div id="dlActive">
                    <div class="empty-hint">正在加载下载列表…</div>
                </div>
                <div class="sec-title" id="dlDoneTitle" style="display:none">已安装 / 已完成</div>
                <div class="dl-list done" id="dlDone"></div>
            </div>

            <div class="card manager-card">
                <div class="card-header">
                    <h2>工具日志</h2>
                    <div class="card-actions">
                        <button class="btn btn-text" id="toolsLogClear"><span class="material-icons">clear_all</span> 清空</button>
                    </div>
                </div>
                <div class="progress-container" id="toolsLog">
                    <div class="progress-placeholder"><span class="material-icons">info</span><p>等待操作...</p></div>
                </div>
            </div>

        </main>
    </div>
</div>

<div class="snackbar" id="snackbar">
    <div class="snackbar-content">
        <span id="snackbarMessage"></span>
        <button class="snackbar-action" id="snackbarClose"><span class="material-icons">close</span></button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
<script src="{{ url_for('static', filename='js/task-log.js') }}"></script>
<script src="{{ url_for('static', filename='js/tools.js') }}"></script>
<script src="{{ url_for('static', filename='js/background-manager.js') }}"></script>
</body>
</html>
